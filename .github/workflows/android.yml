name: KamiGram Build & Release

on:
  push:
    branches: [master, main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kamigram-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build KamiGram APK
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install NDK & CMake
        run: |
          yes | sdkmanager "ndk;21.4.7075529" "cmake;3.10.2" > /dev/null || true

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is not set"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > kamigram.jks
          echo "Keystore restored ($(stat -c%s kamigram.jks) bytes)"

      - name: Restore Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "No GOOGLE_SERVICES_JSON secret: building without FCM push."
            exit 0
          fi
          for m in TMessagesProj_App TMessagesProj_AppStandalone; do
            printf '%s' "$GOOGLE_SERVICES_JSON" > "$m/google-services.json"
          done
          python3 - <<'PY'
          import json, sys
          d = json.load(open('TMessagesProj_App/google-services.json'))
          pkgs = [c['client_info']['android_client_info']['package_name'] for c in d['client']]
          print('Firebase project:', d['project_info']['project_id'], 'clients:', pkgs)
          if 'com.kaminari.gram' not in pkgs:
              sys.exit('google-services.json has no client for com.kaminari.gram')
          PY

      - name: Build universal release APK
        env:
          TELEGRAM_APP_ID: ${{ secrets.TELEGRAM_APP_ID }}
          TELEGRAM_APP_HASH: ${{ secrets.TELEGRAM_APP_HASH }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew :TMessagesProj_App:assembleAfatRelease \
            --stacktrace --no-daemon \
            -PTELEGRAM_APP_ID="$TELEGRAM_APP_ID" \
            -PTELEGRAM_APP_HASH="$TELEGRAM_APP_HASH" \
            -PRELEASE_STORE_FILE="$GITHUB_WORKSPACE/kamigram.jks" \
            -PRELEASE_STORE_PASSWORD="$RELEASE_STORE_PASSWORD" \
            -PRELEASE_KEY_ALIAS="$RELEASE_KEY_ALIAS" \
            -PRELEASE_KEY_PASSWORD="$RELEASE_KEY_PASSWORD"

      - name: Locate & rename APK
        id: apk
        run: |
          APK=$(find TMessagesProj_App/build/outputs/apk -name '*.apk' | head -n1)
          echo "Found: $APK"
          DEST="KamiGram-${GITHUB_SHA::7}.apk"
          cp "$APK" "$DEST"
          ls -lh "$DEST"
          echo "path=$DEST" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: KamiGram-APK
          path: ${{ steps.apk.outputs.path }}
          retention-days: 30

      - name: Analyze APK
        run: |
          APK="${{ steps.apk.outputs.path }}"
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort | tail -n1)
          "$AAPT" dump badging "$APK" > badging.txt
          grep -E "^package:|^sdkVersion:|^targetSdkVersion:|^application-label:|^native-code:" badging.txt || true

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -n1)
          echo "apksigner: $APKSIGNER"
          set +e
          "$APKSIGNER" verify --verbose --print-certs "$APK" > signature.txt 2>&1
          rc=$?
          set -e
          cat signature.txt
          if [ "$rc" -ne 0 ]; then
            echo "::error::apksigner exited $rc; APK signature is not valid"
            exit 1
          fi
          rm -f badging.txt signature.txt

      - name: Clean up secrets
        if: always()
        run: rm -f kamigram.jks */google-services.json

      - name: Create GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: true
